name: docker-build

# Build & push the Open-Jev serving image to the SF dedicated registry.
# Same convention as the kev / jev-proxy / agent repos (FaaS Push Skill §7.5):
#   - trigger: push to main (github.sha on main = merge commit)
#   - image tag = 7-char short SHA of that commit; no latest/main tags (§7.1)
#
# Dual-registry push (one build, two tags):
#   primary: hub.6scloud.com/d1r7umcsfi9c73b4drdg/open-jev:<short-sha>
#   mirror : hub.6scloud.com/clxuaivn500083i7ncuxpw8cf/${REMOTE_IMAGE_NAME}:${REMOTE_TAG_NAME}
# REMOTE_IMAGE_NAME / REMOTE_TAG_NAME come from repo secrets; when unset they
# fall back to `open-jev` / the same short SHA. The REGISTRY_USER account must
# hold push rights in BOTH namespaces.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: hub.6scloud.com
  NAMESPACE: d1r7umcsfi9c73b4drdg
  MIRROR_NAMESPACE: clxuaivn500083i7ncuxpw8cf
  IMAGE_NAME: open-jev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        env:
          REMOTE_IMAGE_NAME: ${{ secrets.REMOTE_IMAGE_NAME }}
          REMOTE_TAG_NAME: ${{ secrets.REMOTE_TAG_NAME }}
        run: |
          short="${GITHUB_SHA:0:7}"
          remote_image="${REMOTE_IMAGE_NAME:-open-jev}"
          remote_tag="${REMOTE_TAG_NAME:-$short}"
          {
            echo "short=$short"
            echo "remote_image=$remote_image"
            echo "remote_tag=$remote_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # SF GPU Functions run nvidia instances only -> linux/amd64 (FaaS Push
      # Skill §7.3). One build, two tags.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.MIRROR_NAMESPACE }}/${{ steps.vars.outputs.remote_image }}:${{ steps.vars.outputs.remote_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image tags
        run: |
          echo "primary: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short }}"
          echo "mirror : ${{ env.REGISTRY }}/${{ env.MIRROR_NAMESPACE }}/${{ steps.vars.outputs.remote_image }}:${{ steps.vars.outputs.remote_tag }}"
